name: CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xp_voca_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/xp_voca_ci?schema=public"
      DIRECT_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/xp_voca_ci?schema=public"
      JWT_SECRET: "ci_pipeline_jwt_secret_key_for_tests_2026"
      PASSWORD_SALT_KEY: "ci_pipeline_password_salt_key_2026"
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Sync Schema
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Run Linter
        run: npm run lint

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm run test

      - name: Production Build Check
        run: npx next build --webpack
